server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;            # no revelar la versión de nginx
    client_max_body_size 2m;      # igual que simucity.api.max-request-bytes del backend

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: mismo origen para el navegador (cookies y CSRF sin CORS). El backend no se publica fuera de Docker.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del frontend sirve index.html, que nunca se cachea (así se ve siempre la última versión).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
