# Integración continua: cada push y pull request ejecuta todas las pruebas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # mínimo privilegio: el flujo solo lee el código

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (motor + API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers usa el Docker del runner para levantar PostgreSQL.
      - run: ./mvnw -B install

  frontend:
    name: Frontend (tipos + pruebas + auditoría)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  e2e:
    name: E2E contra el stack de Docker (nginx + CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Configuración de prueba
        run: |
          cp .env.example .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 24)|" .env
      - name: Construir y levantar el stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8081 npx playwright test
      - name: Registros si algo falla
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
