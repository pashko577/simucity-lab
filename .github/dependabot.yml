# Dependabot: avisa (con pull requests) de dependencias desactualizadas o con vulnerabilidades conocidas.
# Cada PR pasa por el CI antes de fusionarse.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
