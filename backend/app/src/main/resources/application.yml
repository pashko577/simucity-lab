# Configuración base (producción). Los valores sensibles llegan por variables de entorno.
# Para desarrollo local usar el perfil "dev" (application-dev.yml).
spring:
  application:
    name: simucity-app
  datasource:
    url: ${SIMUCITY_DB_URL}
    username: ${SIMUCITY_DB_USER}
    password: ${SIMUCITY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # El esquema lo controla Flyway, nunca Hibernate.
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

simucity:
  api:
    max-page-size: 100
    max-request-bytes: 2097152       # 2 MB: una red de 2000 calles ocupa ~0,5 MB en JSON
  runs:
    worker-threads: 2                # simulaciones en paralelo en este servidor
    queue-capacity: 20               # ejecuciones en espera antes de rechazar nuevas
    max-active-per-user: 2           # PENDING + RUNNING por usuario
    max-duration-seconds: 7200       # duración simulada máxima (más estricta que el motor)
    timeout: 120s                    # tiempo real máximo de cálculo por ejecución
    max-expected-vehicles: 50000
    max-sample-cells: 300000         # muestras × calles
